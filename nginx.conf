server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Роутинг для SPA (React / Vue / Angular), чтобы при обновлении страницы не было 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование запросов на Render
    location /api/ {
        # Слэш в конце важен, если на бэкенде нет префикса /api (подробнее ниже)
        proxy_pass https://backend-app-latest-qoc9.onrender.com;

        # КРИТИЧНО ДЛЯ RENDER: передаём домен Render, а не вашего фронтенда
        proxy_set_header Host backend-app-latest-qoc9.onrender.com;
        proxy_ssl_server_name on;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
